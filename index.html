
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플랜드 파티 지원서</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system,
                BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background-color: #1e1f22;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b5bac1;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e1f22;
            background-color: #383a40;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #5865f2;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #5865f2;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #4752c4;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: #2dc770;
        }

        .error {
            color: #f23f43;
        }

        .user-info {
            background-color: #1e1f22;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #2dc770;
            margin-bottom: 18px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .unit {
            color: #949ba4;
            font-size: 12px;
            margin-top: 5px;
        }

        /* 날짜 입력 영역 */
        .date-picker-wrap {
            position: relative;
            width: 100%;
        }

        .date-display {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e1f22;
            background-color: #383a40;
            color: #fff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .date-display:focus-within {
            border-color: #5865f2;
        }

        .date-placeholder {
            color: #949ba4;
        }

        .date-icon {
            flex-shrink: 0;
            color: #dbdee1;
            font-size: 16px;
        }

        /* 실제 달력 입력창은 투명하게 겹침 */
        .native-date {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            padding: 0;
            border: 0;
            z-index: 2;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>파티 지원서 제출</h2>

    <div id="userInfo" class="user-info">
        🔗 디스코드 계정 연동 완료
    </div>

    <form id="applyForm">

        <div class="form-group">
            <label for="nickname">인게임 닉네임</label>
            <input
                type="text"
                id="nickname"
                placeholder="예: 홍길동"
                required
            >
        </div>

        <div class="form-group">
            <label for="roleType">구분</label>
            <select id="roleType" required>
                <option value="손님">손님</option>
                <option value="용병">용병</option>
            </select>
        </div>

        <div id="guestFields">

            <div class="form-group">
                <label for="level">레벨</label>
                <input
                    type="number"
                    id="level"
                    placeholder="예: 123"
                    min="1"
                    max="300"
                >
            </div>

            <div class="form-group">
                <label for="amount">가격</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="예: 4000"
                    min="0"
                >
                <div class="unit">단위: 만 메소</div>
            </div>

            <div class="form-group">
                <label for="returnStatus">반납 여부</label>
                <select id="returnStatus">
                    <option value="반납">반납</option>
                    <option value="미반납">미반납</option>
                </select>
            </div>

        </div>

        <div class="form-group">
            <label for="applyDate">참여 희망 날짜</label>

            <div class="date-picker-wrap">

                <div class="date-display">
                    <span id="dateText" class="date-placeholder">
                        날짜를 선택해주세요
                    </span>
                    <span class="date-icon">▦</span>
                </div>

                <input
                    type="date"
                    id="applyDate"
                    class="native-date"
                    required
                >

            </div>
        </div>

        <button type="submit" id="submitBtn">
            제출하기
        </button>

    </form>

    <div id="status"></div>
</div>

<script>
    const BACKEND_URL =
        "https://bot-t3zc.onrender.com/api/apply";

    const urlParams =
        new URLSearchParams(window.location.search);

    const discordId =
        urlParams.get('discord_id');

    const roleType =
        document.getElementById('roleType');

    const guestFields =
        document.getElementById('guestFields');

    const levelInput =
        document.getElementById('level');

    const amountInput =
        document.getElementById('amount');

    const returnInput =
        document.getElementById('returnStatus');

    const applyDate =
        document.getElementById('applyDate');

    const dateText =
        document.getElementById('dateText');


    // 날짜 표시 형식: 2026-11-26 (목)
    function updateDateDisplay() {

        if (!applyDate.value) {
            dateText.innerText = "날짜를 선택해주세요";
            dateText.classList.add("date-placeholder");
            return;
        }

        const [year, month, day] =
            applyDate.value.split('-').map(Number);

        const date =
            new Date(year, month - 1, day);

        const days = [
            "일", "월", "화", "수",
            "목", "금", "토"
        ];

        dateText.innerText =
            `${applyDate.value} (${days[date.getDay()]})`;

        dateText.classList.remove("date-placeholder");
    }


    // 날짜 입력창 클릭 시 달력 열기
    applyDate.addEventListener('click', () => {

        if (typeof applyDate.showPicker === 'function') {
            applyDate.showPicker();
        }

    });


    // 날짜 선택 시 표시 변경
    applyDate.addEventListener(
        'change',
        updateDateDisplay
    );


    // 손님 / 용병 선택에 따른 입력 항목 변경
    function updateGuestFields() {

        const isGuest =
            roleType.value === "손님";

        guestFields.classList.toggle(
            "hidden",
            !isGuest
        );

        levelInput.required = isGuest;
        amountInput.required = isGuest;
        returnInput.required = isGuest;
    }

    roleType.addEventListener(
        'change',
        updateGuestFields
    );

    updateGuestFields();


    // 디스코드 계정 확인
    if (!discordId) {

        document.getElementById('userInfo').className =
            "user-info error";

        document.getElementById('userInfo').innerText =
            "⚠️ 잘못된 접근입니다. 디스코드 봇 링크를 통해 접속해주세요.";

        document.getElementById('submitBtn').disabled =
            true;
    }


    // 지원서 제출
    document.getElementById('applyForm')
        .addEventListener('submit', async (e) => {

        e.preventDefault();

        const submitBtn =
            document.getElementById('submitBtn');

        const statusDiv =
            document.getElementById('status');

        const isGuest =
            roleType.value === "손님";

        submitBtn.disabled = true;
        submitBtn.innerText = "제출 중...";
        statusDiv.innerText = "";

        const formData = {
            discord_id: discordId,

            nickname:
                document.getElementById('nickname')
                    .value.trim(),

            role_type: roleType.value,

            job:
                document.getElementById('job')
                    .value.trim(),

            apply_date:
                applyDate.value,

            level: isGuest
                ? Number(levelInput.value)
                : null,

            amount: isGuest
                ? Number(amountInput.value)
                : null,

            return_status: isGuest
                ? returnInput.value
                : null
        };

        try {

            const response = await fetch(
                BACKEND_URL,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                }
            );

            if (response.ok) {

                const result =
                    await response.json();

                statusDiv.className = "success";

                statusDiv.innerText =
                    result.message || "✅ 지원서 제출 완료!";

                document.getElementById('applyForm').reset();

                updateGuestFields();
                updateDateDisplay();

            } else {

                const errData =
                    await response.json();

                throw new Error(
                    errData.detail || "서버 처리 실패"
                );
            }

        } catch (err) {

            statusDiv.className = "error";

            statusDiv.innerText =
                "❌ 제출 실패: " +
                (err.message || "서버 연결을 확인해주세요.");

        } finally {

            submitBtn.disabled = false;
            submitBtn.innerText = "제출하기";
        }
    });

</script>

</body>
</html>
