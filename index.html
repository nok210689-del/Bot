
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플랜드 파티 지원서</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            background: #1e1f22;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #2b2d31;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b5bac1;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e1f22;
            background: #383a40;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #5865f2;
        }

        select:invalid {
            color: #949ba4;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #5865f2;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .success {
            color: #2dc770;
        }

        .error {
            color: #f23f43;
        }

        .user-info {
            background: #1e1f22;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #2dc770;
            margin-bottom: 18px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* 날짜 선택 */
        .date-picker-wrap {
            position: relative;
        }

        .date-display {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1e1f22;
            background: #383a40;
            color: #fff;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .date-display:hover {
            border-color: #5865f2;
        }

        .date-placeholder {
            color: #fEE75C;
            font-weight: 500;
        }

        .date-icon {
            color: #dbdee1;
            font-size: 17px;
        }

        /* 에러 흔들림 */
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }

        .error-highlight {
            border-color: #f23f43 !important;
            animation: shake 0.4s ease-in-out;
            background: rgba(242, 63, 67, 0.1) !important;
        }

        /* 달력 */
        .calendar {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            min-width: 280px;
            padding: 15px;
            background: #2b2d31;
            border: 1px solid #45474e;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            z-index: 100;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .calendar-header button {
            width: 36px;
            height: 36px;
            padding: 0;
            margin: 0;
            background: #383a40;
            font-size: 18px;
        }

        .calendar-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .calendar-weekday {
            padding: 8px 0;
            font-size: 12px;
            color: #949ba4;
            font-weight: bold;
        }

        .calendar-day {
            height: 36px;
            padding: 0;
            margin: 0;
            border-radius: 6px;
            background: transparent;
            color: #dbdee1;
            font-size: 13px;
            font-weight: normal;
        }

        .calendar-day:hover {
            background: #45474e;
        }

        .calendar-day.selected {
            background: #5865f2;
            color: #fff;
            font-weight: bold;
        }

        .calendar-day.today {
            border: 1px solid #5865f2;
        }

        .calendar-day.other {
            color: #666a73;
        }

        .calendar-day:disabled {
            opacity: 0.2;
            cursor: default;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>파티 지원서 제출</h2>

    <div id="userInfo" class="user-info">
        🔗 디스코드 계정 연동 완료
    </div>

    <form id="applyForm">

        <div class="form-group">
            <label for="nickname">인게임 닉네임</label>
            <input
                type="text"
                id="nickname"
                placeholder="예: 홍길동"
                required
            >
        </div>

        <div class="form-group">
            <label for="roleType">구분</label>
            <select id="roleType" required>
                <option value="" disabled selected>지원 유형을 선택하세요</option>
                <option value="손님">손님</option>
                <option value="용병">용병</option>
            </select>
        </div>

        <div class="form-group">
            <label for="level">레벨</label>
            <input
                type="number"
                id="level"
                placeholder="예: 123"
                min="1"
                max="200"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label for="job">직업</label>
            <input
                type="text"
                id="job"
                placeholder="예: 비숍"
                required
            >
        </div>

        <!-- 약속 날짜 -->
        <div class="form-group">
            <label>
                약속 날짜
                <span style="color: #fEE75C; font-size: 12px; font-weight: normal;">
                    (※ 작성일이 아닌 실제 약속 날짜 선택)
                </span>
            </label>

            <div class="date-picker-wrap">
                <div
                    class="date-display"
                    id="dateDisplay"
                    tabindex="0"
                    role="button"
                    aria-haspopup="true"
                    aria-expanded="false"
                >
                    <span id="dateText" class="date-placeholder">
                        👉 클릭해서 약속 날짜를 직접 선택하세요
                    </span>
                    <span class="date-icon">📅</span>
                </div>

                <input type="hidden" id="applyDate" value="">

                <div id="calendar" class="calendar hidden">
                    <div class="calendar-header">
                        <button type="button" id="prevMonth">‹</button>
                        <span id="calendarTitle" class="calendar-title"></span>
                        <button type="button" id="nextMonth">›</button>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">제출하기</button>

    </form>

    <div id="status"></div>
</div>

<script>
    const BACKEND_URL = "https://bot-fmim.onrender.com/api/apply";

    const urlParams = new URLSearchParams(window.location.search);
    const discordId = urlParams.get('discord_id');

    const roleType = document.getElementById('roleType');
    const levelInput = document.getElementById('level');
    const nicknameInput = document.getElementById('nickname');
    const jobInput = document.getElementById('job');

    const applyDate = document.getElementById('applyDate');
    const dateText = document.getElementById('dateText');
    const dateDisplay = document.getElementById('dateDisplay');

    const calendar = document.getElementById('calendar');
    const calendarTitle = document.getElementById('calendarTitle');
    const calendarGrid = document.getElementById('calendarGrid');

    const applyForm = document.getElementById('applyForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const today = new Date();

    let calendarYear = today.getFullYear();
    let calendarMonth = today.getMonth();

    let isSubmitting = false;

    function formatDate(year, month, day) {
        return [
            year,
            String(month + 1).padStart(2, '0'),
            String(day).padStart(2, '0')
        ].join('-');
    }

    function updateDateDisplay() {
        if (!applyDate.value) {
            dateText.innerText =
                "👉 클릭해서 약속 날짜를 직접 선택하세요";

            dateText.classList.add("date-placeholder");
            return;
        }

        const [year, month, day] = applyDate.value.split('-').map(Number);
        const date = new Date(year, month - 1, day);

        dateText.innerText =
            `${applyDate.value} (${days[date.getDay()]})`;

        dateText.classList.remove("date-placeholder");
    }

    function openCalendar() {
        if (applyDate.value) {
            const [year, month] = applyDate.value.split('-').map(Number);
            calendarYear = year;
            calendarMonth = month - 1;
        }

        renderCalendar();
        calendar.classList.remove("hidden");
        dateDisplay.setAttribute("aria-expanded", "true");
    }

    function closeCalendar() {
        calendar.classList.add("hidden");
        dateDisplay.setAttribute("aria-expanded", "false");
    }

    function renderCalendar() {
        calendarTitle.innerText =
            `${calendarYear}년 ${calendarMonth + 1}월`;

        calendarGrid.innerHTML = "";

        days.forEach(day => {
            const cell = document.createElement("div");
            cell.className = "calendar-weekday";
            cell.innerText = day;
            calendarGrid.appendChild(cell);
        });

        const firstDay =
            new Date(calendarYear, calendarMonth, 1).getDay();

        const lastDate =
            new Date(calendarYear, calendarMonth + 1, 0).getDate();

        const previousLastDate =
            new Date(calendarYear, calendarMonth, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const day = previousLastDate - firstDay + i + 1;

            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "calendar-day other";
            cell.innerText = day;
            cell.disabled = true;

            calendarGrid.appendChild(cell);
        }

        const todayValue = formatDate(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );

        for (let day = 1; day <= lastDate; day++) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "calendar-day";
            cell.innerText = day;

            const dateValue = formatDate(
                calendarYear,
                calendarMonth,
                day
            );

            // 오늘 이전 날짜 선택 불가
            if (dateValue < todayValue) {
                cell.disabled = true;
                cell.classList.add("other");
            }

            if (dateValue === applyDate.value) {
                cell.classList.add("selected");
            }

            if (
                calendarYear === today.getFullYear() &&
                calendarMonth === today.getMonth() &&
                day === today.getDate()
            ) {
                cell.classList.add("today");
            }

            if (!cell.disabled) {
                cell.addEventListener('click', () => {
                    applyDate.value = dateValue;

                    updateDateDisplay();
                    closeCalendar();

                    dateDisplay.classList.remove("error-highlight");
                    statusDiv.innerText = "";
                });
            }

            calendarGrid.appendChild(cell);
        }

        const totalCells = firstDay + lastDate;
        const remaining = (7 - totalCells % 7) % 7;

        for (let i = 1; i <= remaining; i++) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "calendar-day other";
            cell.innerText = i;
            cell.disabled = true;

            calendarGrid.appendChild(cell);
        }
    }

    dateDisplay.addEventListener('click', (e) => {
        e.stopPropagation();

        if (calendar.classList.contains("hidden")) {
            openCalendar();
        } else {
            closeCalendar();
        }
    });

    calendar.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    dateDisplay.addEventListener('keydown', (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            dateDisplay.click();
        }

        if (e.key === "Escape") {
            closeCalendar();
        }
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
        calendarMonth--;

        if (calendarMonth < 0) {
            calendarMonth = 11;
            calendarYear--;
        }

        renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
        calendarMonth++;

        if (calendarMonth > 11) {
            calendarMonth = 0;
            calendarYear++;
        }

        renderCalendar();
    });

    document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.date-picker-wrap');

        if (!wrap.contains(e.target)) {
            closeCalendar();
        }
    });

    // 디스코드 연동 확인
    if (!discordId) {
        const userInfo = document.getElementById('userInfo');

        userInfo.className = "user-info error";
        userInfo.innerText =
            "⚠️ 잘못된 접근입니다. 디스코드 봇 링크를 통해 접속해주세요.";

        submitBtn.disabled = true;
    }

    // 제출
    applyForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (isSubmitting) {
            return;
        }

        if (!discordId) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 디스코드 계정 연동을 확인해주세요.";
            return;
        }

        // 닉네임 공백 검사
        const nickname = nicknameInput.value.trim();

        if (!nickname) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 인게임 닉네임을 입력해주세요.";

            nicknameInput.focus();
            return;
        }

        // 지원 유형 검사
        if (!roleType.value) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 지원 유형을 선택해주세요.";

            roleType.focus();
            return;
        }

        // 레벨 검사
        const level = Number(levelInput.value);

        if (
            levelInput.value.trim() === "" ||
            !Number.isInteger(level) ||
            level < 1 ||
            level > 200
        ) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 레벨은 1~200 사이의 정수로 입력해주세요.";

            levelInput.focus();
            return;
        }

        // 직업 검사
        const job = jobInput.value.trim();

        if (!job) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 직업을 입력해주세요.";

            jobInput.focus();
            return;
        }

        // 약속 날짜 검사
        if (!applyDate.value) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 약속 날짜를 선택해주세요.";

            dateDisplay.classList.add("error-highlight");
            openCalendar();
            return;
        }

        const [dateYear, dateMonth, dateDay] =
            applyDate.value.split('-').map(Number);

        const selectedDate = new Date(
            dateYear,
            dateMonth - 1,
            dateDay
        );

        const todayValue = formatDate(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );

        if (
            isNaN(selectedDate.getTime()) ||
            formatDate(dateYear, dateMonth - 1, dateDay) !== applyDate.value ||
            applyDate.value < todayValue
        ) {
            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 올바른 약속 날짜를 선택해주세요.";

            openCalendar();
            return;
        }

        // 제출 전 전체 내용 확인
        const confirmMessage =
            "아래 내용으로 지원서를 제출하시겠습니까?\n\n" +
            "━━━━━━━━━━━━━━━━━━\n" +
            "인게임 닉네임 : " + nickname + "\n" +
            "구분 : " + roleType.value + "\n" +
            "레벨 : " + level + "\n" +
            "직업 : " + job + "\n" +
            "약속 날짜 : " + applyDate.value + "\n" +
            "━━━━━━━━━━━━━━━━━━\n\n" +
            "내용이 정확하다면 확인을 눌러주세요.";

        if (!confirm(confirmMessage)) {
            return;
        }

        // 서버 전송 데이터
        const formData = {
            discord_id: discordId,
            nickname: nickname,
            role_type: roleType.value,
            job: job,
            apply_date: applyDate.value,
            level: level
        };

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerText = "제출 중...";
        statusDiv.className = "";
        statusDiv.innerText = "";

        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "서버 처리 실패");
            }

            statusDiv.className = "success";
            statusDiv.innerText =
                result.message || "✅ 지원서 제출 완료!";

            applyForm.reset();

            applyDate.value = "";
            updateDateDisplay();
            closeCalendar();

            calendarYear = today.getFullYear();
            calendarMonth = today.getMonth();

        } catch (err) {
            console.error("지원서 제출 오류:", err);

            statusDiv.className = "error";
            statusDiv.innerText =
                "❌ 제출 실패: " +
                (err.message || "서버 연결을 확인해주세요.");

        } finally {
            isSubmitting = false;
            submitBtn.disabled = !discordId;
            submitBtn.innerText = "제출하기";
        }
    });
</script>

</body>
</html>
